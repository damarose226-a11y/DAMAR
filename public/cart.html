<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dama Rose | السلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0a2f27;--green2:#123f34;--beige:#cbb58a;--beige2:#e7dbc3;--cream:#f6f0e3;--gold:#c7a45a;--gold2:#e5c77f;--ink:#18332b;--line:#dcc79c;--muted:#7f7159}
*{box-sizing:border-box}body{margin:0;font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink)}a{text-decoration:none;color:inherit}button{font:inherit}.container{width:min(760px,94%);margin:auto}
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,42,34,.97);border-bottom:1px solid rgba(229,199,127,.3);backdrop-filter:blur(10px)}
.nav{height:64px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:'tools brand spacer';align-items:center;direction:ltr}.brand{display:none}.brand img{height:54px;display:block}.tools{grid-area:tools;display:flex;gap:8px;align-items:center;justify-content:flex-start}.lang{border:1px solid rgba(229,199,127,.55);color:#f3e7cb;padding:7px 10px;border-radius:999px;font-size:12px}.cart{position:relative;width:40px;height:40px;border:1px solid rgba(229,199,127,.5);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:19px}.badge{position:absolute;right:-4px;top:-5px;background:var(--beige2);color:var(--green);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700}
.page{padding:26px 0 54px}.back{display:inline-flex;align-items:center;gap:8px;color:#6f6045;font-size:14px;margin-bottom:18px}.head{margin-bottom:20px}.eyebrow{color:#9a7439;font-size:13px;font-weight:700}.head h1{font-size:32px;margin:4px 0 6px;color:var(--green)}.head p{margin:0;color:var(--muted);font-size:14px}
.cartbox{background:#fbf6ec;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 16px 50px rgba(40,32,18,.07)}.items{padding:10px 18px}.item{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #eadbc0}.item:last-child{border-bottom:0}.thumb{width:72px;height:64px;border-radius:16px;background:linear-gradient(135deg,#d7c39d,#efe4cf);border:1px solid #d7c293;display:grid;place-items:center;color:#816c4a;font-size:11px}.name{font-weight:800;color:var(--green);margin-bottom:4px}.option{font-size:13px;color:var(--muted);margin-bottom:9px}.controls{display:flex;align-items:center;gap:8px}.qbtn{width:31px;height:31px;border-radius:10px;border:1px solid #d2bc8e;background:#fffaf0;color:var(--green);font-size:18px;cursor:pointer}.qnum{min-width:22px;text-align:center;font-weight:700}.remove{border:0;background:transparent;color:#9a6b54;font-size:12px;padding:4px 0;cursor:pointer}.money{text-align:left}.unit{font-size:13px;color:var(--muted);white-space:nowrap}.lineprice{font-size:17px;font-weight:800;color:#8a642a;white-space:nowrap;margin-top:4px}
.summary{border-top:1px solid var(--line);background:#f2e8d6;padding:20px}.sumrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.sumrow span{color:#6e604b}.total{font-size:26px;font-weight:800;color:var(--green)}.whatsapp{width:100%;border:0;border-radius:16px;padding:15px 18px;background:linear-gradient(180deg,#153f34,#0a2f27);color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 10px 25px rgba(10,47,39,.18)}.whatsapp:disabled{opacity:.45;cursor:not-allowed}.continue{display:block;text-align:center;margin-top:12px;font-size:13px;color:#74654d}
.empty{padding:48px 24px;text-align:center}.empty .icon{width:74px;height:74px;margin:0 auto 16px;border:1px solid #d8c49b;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#f7efdf}.empty h2{margin:0 0 7px;color:var(--green);font-size:22px}.empty p{margin:0 0 20px;color:var(--muted);font-size:14px}.shop{display:inline-block;background:var(--green);color:white;padding:12px 20px;border-radius:14px;font-weight:700}.notice{display:none;margin-top:14px;padding:12px 14px;background:#efe1c8;border:1px solid #d7bd8b;border-radius:14px;color:#6f5b37;font-size:13px;line-height:1.6}
.customer{margin:20px 0 14px;padding:18px;background:#fbf7ef;border:1px solid #eadfc8;border-radius:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;direction:rtl}.customer-title{grid-column:1/-1;font-weight:800;color:var(--green);font-size:16px;margin-bottom:2px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700;color:#6f5b37}.field input{width:100%;box-sizing:border-box;border:1px solid #d8c79f;border-radius:12px;padding:13px 14px;background:#fff;color:var(--ink);font:inherit;outline:none;transition:.2s}.field input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(12,55,48,.08)}.customer-error{display:none;grid-column:1/-1;color:#9a3b2f;font-size:13px;margin-top:1px}@media(max-width:600px){.customer{grid-template-columns:1fr;padding:15px}.customer-title,.customer-error{grid-column:1}}
@media(max-width:520px){.item{grid-template-columns:60px 1fr}.thumb{width:60px;height:60px}.money{grid-column:2;text-align:right;display:flex;gap:10px;align-items:center}.lineprice{margin:0}.head h1{font-size:28px}}
.cart svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<header class="topbar"><div class="container nav"><div class="tools"><a class="lang" href="#">EN | AR</a><a class="cart" href="cart.html" aria-label="السلة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h2l1.7 9.1a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.9-1.4L20.5 8H6.1"/><path d="M9.5 19.5h.01M17.5 19.5h.01"/></svg><span class="badge" id="cartBadge">0</span></a></div></div></header>
<main class="page"><div class="container"><a class="back" href="index.html">← متابعة التسوق</a><div class="head"><div class="eyebrow">Dama Rose</div><h1>سلة الطلب</h1><p>راجع المنتجات والكميات قبل إرسال الطلب عبر واتساب.</p></div><section class="cartbox" id="cartBox"><div id="content"></div></section></div></main>
<script>
let cart=[];try{cart=JSON.parse(localStorage.getItem('damaRoseCart')||'[]');if(!Array.isArray(cart))cart=[];cart=cart.map(i=>({...i,image:''}));localStorage.setItem('damaRoseCart',JSON.stringify(cart))}catch(e){cart=[];localStorage.removeItem('damaRoseCart')}let settings={whatsapp:'92415565'};
const content=document.getElementById('content'),badge=document.getElementById('cartBadge');const money=n=>Number(n||0).toFixed(3)+' ر.ع';
function save(){localStorage.setItem('damaRoseCart',JSON.stringify(cart));render()}function units(){return cart.reduce((s,i)=>s+(Number(i.quantity)||0),0)}function total(){return cart.reduce((s,i)=>s+(Number(i.price)||0)*(Number(i.quantity)||0),0)}function changeQty(key,d){const i=cart.find(x=>x.key===key);if(!i)return;i.quantity=Math.max(1,(Number(i.quantity)||1)+d);save()}function removeItem(key){cart=cart.filter(i=>i.key!==key);save()}
function cleanWhats(v){const n=String(v||'').replace(/\D/g,'');return n.length===8?'968'+n:n}
function sendWhatsApp(){if(!cart.length)return;const name=(document.getElementById('customerName')?.value||'').trim(),phone=(document.getElementById('customerPhone')?.value||'').trim(),err=document.getElementById('customerError');if(!name||!phone){if(err)err.style.display='block';return}if(err)err.style.display='none';const num=cleanWhats(settings.whatsapp);if(!num){document.getElementById('notice').style.display='block';return}const lines=['طلب جديد من Dama Rose','','اسم العميل: '+name,'رقم الهاتف: '+phone,''];cart.forEach((i,n)=>lines.push((n+1)+'. '+((localStorage.getItem("dr_lang")==="en"&&i.nameEn)?i.nameEn:i.name)+' — '+i.option+' × '+i.quantity+' — '+money(i.price*i.quantity)));lines.push('','الإجمالي: '+money(total()));window.open('https://wa.me/'+num+'?text='+encodeURIComponent(lines.join('\n')),'_blank')}
function render(){badge.textContent=units();if(!cart.length){content.innerHTML='<div class="empty"><div class="icon">🛒</div><h2>السلة فارغة</h2><p>لم تضف أي منتجات إلى طلبك بعد.</p><a class="shop" href="index.html#products">تصفح المنتجات</a></div>';return}const rows=cart.map(i=>'<div class="item"><div><div class="name">'+((localStorage.getItem("dr_lang")==="en"&&i.nameEn)?i.nameEn:i.name)+'</div><div class="option">'+i.option+'</div><div class="controls"><button class="qbtn" onclick="changeQty(\''+i.key.replace(/'/g,"\\'")+'\',1)">+</button><span class="qnum">'+i.quantity+'</span><button class="qbtn" onclick="changeQty(\''+i.key.replace(/'/g,"\\'")+'\',-1)">−</button><button class="remove" onclick="removeItem(\''+i.key.replace(/'/g,"\\'")+'\')">حذف</button></div></div><div class="money"><div class="unit">'+money(i.price)+' / الوحدة</div><div class="lineprice">'+money(i.price*i.quantity)+'</div></div></div>').join('');content.innerHTML='<div class="items">'+rows+'</div><div class="summary"><div class="sumrow"><span>الإجمالي</span><strong class="total">'+money(total())+'</strong></div><div class="customer"><div class="customer-title">بيانات العميل</div><div class="field"><label for="customerName">الاسم</label><input id="customerName" type="text" autocomplete="name" placeholder="اكتب اسمك" required></div><div class="field"><label for="customerPhone">رقم الهاتف</label><input id="customerPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="مثال: 91234567" required></div><div class="customer-error" id="customerError">يرجى إدخال الاسم ورقم الهاتف لإكمال الطلب.</div></div><button class="whatsapp" onclick="sendWhatsApp()">إرسال الطلب عبر واتساب</button><div class="notice" id="notice">رقم واتساب غير مضبوط بعد.</div><a class="continue" href="index.html#products">+ إضافة منتجات أخرى</a></div>'}
fetch('/api/settings').then(r=>r.json()).then(x=>settings=x).catch(()=>{});render();
</script>
<script src="/lang.js"></script>
</body>
</html>
