<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dama Rose | العروض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa+Ink:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0a2f27;--green2:#123f34;--beige:#cbb58a;--beige2:#e7dbc3;--cream:#f6f0e3;--gold:#c7a45a;--gold2:#e5c77f;--ink:#18332b;--line:#dcc79c;--muted:#7f7159}
*{box-sizing:border-box}body{margin:0;font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);letter-spacing:.012em}a{text-decoration:none;color:inherit}button{font:inherit;letter-spacing:.008em}.container{width:min(1120px,94%);margin:auto}
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,42,34,.97);border-bottom:1px solid rgba(229,199,127,.3);backdrop-filter:blur(10px)}
.nav{height:78px;display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:'tools brand menu';align-items:center;gap:22px;direction:ltr}.brand{grid-area:brand}.brand img{height:60px;display:block;margin:auto}.menu{grid-area:menu;display:flex;gap:25px;justify-content:flex-end;direction:rtl;color:#f4e8ce;font-size:14px}.menu a{padding:28px 0 23px;border-bottom:2px solid transparent}.menu a.active,.menu a:hover{color:var(--gold2);border-color:var(--gold2)}.tools{grid-area:tools;display:flex;gap:9px;align-items:center;justify-content:flex-start}.lang{border:1px solid rgba(229,199,127,.55);color:#f3e7cb;padding:7px 11px;border-radius:999px;font-size:12px}.cart{position:relative;width:42px;height:42px;border:1px solid rgba(229,199,127,.5);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:20px}.badge{position:absolute;right:-4px;top:-5px;background:var(--beige2);color:var(--green);width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700}
.hero{background:radial-gradient(circle at 18% 20%,rgba(229,199,127,.13),transparent 23%),linear-gradient(120deg,#082b23,#0d382e 56%,#08271f);color:#fff;padding:76px 0 68px;border-bottom:1px solid rgba(199,164,90,.35);overflow:hidden;position:relative}.hero:after{content:"";position:absolute;left:-80px;top:-70px;width:330px;height:330px;border:1px solid rgba(229,199,127,.22);border-radius:50%;box-shadow:0 0 0 28px rgba(229,199,127,.04),0 0 0 56px rgba(229,199,127,.025)}.eyebrow{color:var(--gold2);font-size:13px;font-weight:700;margin-bottom:10px}.hero h1{margin:0;color:#f4e3bd;font-size:48px}.hero p{margin:12px 0 0;max-width:620px;color:#e3d8c2;line-height:1.9;font-size:17px}
.page{padding:54px 0 72px}.head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:26px}.head h2{margin:0;color:var(--green);font-size:32px}.head p{margin:7px 0 0;color:var(--muted);font-size:14px}.count{font-size:13px;color:#876c41;background:#efe2c9;border:1px solid #d7c093;border-radius:999px;padding:8px 12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.offer-card{background:#fbf5e9;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(44,34,17,.06)}.offer-image{height:210px;background:linear-gradient(135deg,#decaa4,#f0e4ce);display:grid;place-items:center;color:#7f6a48;font-size:13px}.offer-body{padding:18px}.tag{display:inline-block;background:var(--green);color:#f2e3c4;border-radius:999px;padding:6px 10px;font-size:11px;margin-bottom:10px}.offer-body h3{margin:0 0 7px;color:var(--green);font-size:20px}.offer-body p{margin:0 0 16px;color:var(--muted);line-height:1.75;font-size:14px}.offer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}.price{font-weight:800;color:#8a642a}.view{background:var(--green);color:white;border-radius:12px;padding:10px 14px;font-size:13px}
.empty{background:#f8f1e3;border:1px dashed #cdb58a;border-radius:26px;padding:70px 24px;text-align:center}.empty-icon{width:82px;height:82px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;border:1px solid #cfb784;background:#efe3cc;font-size:32px}.empty h3{margin:0 0 8px;color:var(--green);font-size:24px}.empty p{margin:0;color:var(--muted);line-height:1.8;font-size:14px}
footer{background:#061f19;color:#e5dbc6;border-top:1px solid rgba(229,199,127,.25);padding:34px 0 20px}.footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.footer img{height:74px}.footer a{color:var(--gold2);font-size:13px}.copy{font-size:12px;opacity:.62}
@media(max-width:850px){.menu{display:none}.nav{grid-template-columns:1fr auto 1fr;grid-template-areas:'tools brand spacer';height:72px}.brand img{height:54px}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:38px}}
@media(max-width:560px){.hero{padding:54px 0 48px}.hero h1{font-size:32px}.hero p{font-size:15px}.page{padding:38px 0 56px}.head{align-items:flex-start;flex-direction:column}.head h2{font-size:27px}.grid{grid-template-columns:1fr}.offer-image{height:180px}}
</style>
</head>
<body>
<header class="topbar"><div class="container nav">
  <a class="brand" href="index.html"><img src="logo.png" alt="Dama Rose"></a>
  <nav class="menu"><a href="index.html">الرئيسية</a><a href="index.html#products">المنتجات</a><a class="active" href="offers.html">العروض</a><a href="about.html">من نحن</a><a href="contact.html">تواصل معنا</a></nav>
  <div class="tools"><a class="lang" href="#">EN | AR</a><a class="cart" href="cart.html" aria-label="السلة">🛒<span class="badge" id="cartBadge">0</span></a></div>
</div></header>

<section class="hero"><div class="container"><div class="eyebrow">Dama Rose</div><h1>العروض</h1><p>هنا تظهر العروض التي تضيفها أنت لاحقًا من لوحة الإدارة، ويمكن تحديثها أو إيقافها في أي وقت.</p></div></section>

<main class="page"><div class="container">
  <div class="head"><div><h2>عروض داما روز</h2><p>قسم مستقل للعروض الموسمية والخاصة.</p></div><div class="count" id="offerCount">0 عرض</div></div>
  <div id="offersArea"></div>
</div></main>

<footer><div class="container footer"><img src="logo.png" alt="Dama Rose"><a href="index.html">العودة للرئيسية</a><div class="copy">© Dama Rose. جميع الحقوق محفوظة.</div></div></footer>

<script>
const area=document.getElementById('offersArea'),count=document.getElementById('offerCount');
const cart=JSON.parse(localStorage.getItem('damaRoseCart')||'[]');document.getElementById('cartBadge').textContent=cart.reduce((s,i)=>s+(Number(i.quantity)||0),0);
async function render(){const r=await fetch('/api/offers');const offers=r.ok?await r.json():[];count.textContent=`${offers.length} عرض`;if(!offers.length){area.innerHTML='<div class="empty">لا توجد عروض متاحة حاليًا.</div>';return}area.innerHTML=`<div class="grid">${offers.map(o=>`<article class="offer-card"><div class="offer-image">Dama Rose</div><div class="offer-body"><span class="tag">عرض</span><h3>${(localStorage.getItem('dr_lang')==='en'&&o.en)?o.en:o.ar}</h3><p>${o.text||''}</p><div class="offer-foot"><span class="price">${o.value||''}</span><a class="view" href="index.html#products">تصفح المنتجات</a></div></div></article>`).join('')}</div>`}
render();
</script>
<script src="/lang.js"></script>
</body>
</html>
