<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dama Rose | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/storefront.css?v=20261002">
<style>
:root{--green:#17483c;--cream:#f5ecdf;--ink:#23483e;--gold:#b88a54;--line:#dec79b}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Tajawal,sans-serif}a{text-decoration:none;color:inherit}
.topbar{position:sticky;top:0;z-index:20;background:rgba(23,72,60,.97);border-bottom:1px solid rgba(215,180,119,.5);backdrop-filter:blur(10px)}
.nav{width:min(1120px,94%);height:64px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.menu{display:flex;align-items:center;gap:24px;color:#f3e7cb}.menu a:hover{color:#d7b477}
.tools{display:flex;align-items:center;gap:10px}.lang{color:#f3e7cb;border:1px solid rgba(215,180,119,.7);padding:7px 12px;border-radius:999px}
.cart{color:#f3e7cb;display:grid;place-items:center}.cart svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{background:linear-gradient(120deg,#17483c,#225c4d);color:#fff;padding:48px 0 40px}.container{width:min(1000px,94%);margin:auto}
.eyebrow{color:#d7b477;font-size:14px;margin-bottom:8px}.hero h1{margin:0;font-size:clamp(32px,5vw,48px);color:#f5e7c6}.hero p{margin:10px 0 0;line-height:1.8;color:#eee2cd}
.category-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:26px 0 72px}.category-item{background:#fffaf1;border:1px solid var(--line);border-radius:16px;padding:20px 22px;color:#17483c;font-size:20px;font-weight:700;box-shadow:0 7px 20px rgba(35,50,35,.04)}.category-item:before{content:"";display:inline-block;width:8px;height:8px;margin-left:12px;border-radius:50%;background:#b88a54;vertical-align:middle}.empty-all{text-align:center;padding:46px 18px;border:1px dashed #c9ad7b;border-radius:18px;color:#70634f;background:#fffaf1}
@media(max-width:560px){.category-list{grid-template-columns:1fr;gap:10px;padding:18px 0 48px}.category-item{padding:16px 18px;font-size:18px}}
footer{background:#123a31;color:#f2e8d8;padding:20px 0;text-align:center;font-size:13px}
@media(max-width:560px){.menu a:not(:first-child){display:none}.hero{padding:38px 0 32px}}
</style>
</head>
<body>
<header class="topbar"><div class="nav"><nav class="menu"><a href="index.html">الرئيسية</a><a href="index.html#products">المنتجات</a><a href="bestsellers.html">الأكثر مبيعًا</a><a href="menu.html">المنيو</a></nav><div class="tools"><a class="lang" href="#">EN | AR</a><a class="cart" href="cart.html" aria-label="السلة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h2l1.7 9.1a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.9-1.4L20.5 8H6.1"/><path d="M9.5 19.5h.01M17.5 19.5h.01"/></svg></a></div></div></header>
<section class="hero"><div class="container"><div class="eyebrow">داما روز</div><h1>منيو داما روز</h1><p>الأقسام الرئيسية للمنيو.</p></div></section>
<main class="container"><div class="category-list" id="menuCategories"><div class="empty-all">جاري تحميل الأقسام...</div></div></main>
<footer><div class="container"><a href="index.html">العودة للرئيسية</a></div></footer>
<script>
const DEFAULT_CATEGORIES=['بقلاوات','قشاطي','كنافة','نواشف','بوظة','هدايا داما روز'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderCategories(value){const names=Array.isArray(value)?value:DEFAULT_CATEGORIES;const list=names.map(x=>String(x||'').trim()).filter(Boolean);document.getElementById('menuCategories').innerHTML=list.length?list.map(x=>'<div class="category-item">'+esc(x)+'</div>').join(''):'<div class="empty-all">لا توجد أقسام في المنيو حاليًا.</div>'}
async function loadCategories(){try{const r=await fetch('/api/menu-categories?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();renderCategories(data.categories)}catch(e){renderCategories(DEFAULT_CATEGORIES)}}
loadCategories();
</script><script src="/lang.js"></script>
</body></html>
