<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوظة | Dama Rose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#17483c;--g2:#225c4d;--cream:#f5ecdf;--gold:#b07a3f;--gold2:#d3a86d;--ink:#23483e}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,Tahoma,Arial,sans-serif;background:var(--cream);color:var(--ink)}a{text-decoration:none;color:inherit}.container{width:min(1180px,92%);margin:auto}
.topbar{position:sticky;top:0;z-index:20;background:rgba(23,72,60,.97);border-bottom:1px solid rgba(229,199,127,.35)}.nav{height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;direction:ltr}.brand img{height:72px;display:block}.back{justify-self:end;direction:rtl;color:#f3e7cb;border:1px solid rgba(229,199,127,.5);padding:9px 14px;border-radius:999px}.cart{justify-self:start;color:#f3e7cb}
.hero{min-height:310px;display:grid;place-items:end start;position:relative;background:linear-gradient(120deg,var(--g),var(--g2));color:white;overflow:hidden}.hero-cover{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.62}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,31,25,.9),rgba(6,31,25,.18))}.hero-content{position:relative;z-index:2;padding:48px 0;width:100%}.hero h1{margin:0;color:#f4dfb5;font-size:44px}.hero p{margin:10px 0 0;max-width:650px;color:#eee4d3;font-size:18px;line-height:1.8}
.section{padding:56px 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.section-head h2{margin:0;font-size:30px}.muted{opacity:.65}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#f7f0e2;border:1px solid #dfc99d;border-radius:18px;overflow:hidden}.ph{height:205px;background:linear-gradient(135deg,#e5d5b6,#c7ad7f);background-size:cover;background-position:center}.card-body{padding:16px}.name{font-weight:700;font-size:17px}.price{margin-top:8px;color:#8b6a2d;font-weight:700}.add{display:inline-block;margin-top:14px;background:var(--g);color:white;border-radius:10px;padding:10px 14px}.empty{grid-column:1/-1;padding:40px;text-align:center;border:1px dashed #d4bd90;border-radius:16px}
footer{background:#061f19;color:#e5dbc6;padding:26px 0;text-align:center}
@media(max-width:900px){.products{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}
@media(max-width:560px){.nav{height:72px}.brand img{height:66px}.hero{min-height:260px}.hero h1{font-size:31px}.products{grid-template-columns:1fr}.section{padding:40px 0}}
.cart svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
<link rel="stylesheet" href="/storefront.css?v=20261002"></head>
<body>
<header class="topbar"><div class="container nav"><a class="cart" href="cart.html" aria-label="السلة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5h2l1.7 9.1a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 1.9-1.4L20.5 8H6.1"/><path d="M9.5 19.5h.01M17.5 19.5h.01"/></svg></a><a class="back" href="index.html#products">← كل الأقسام</a></div></header>
<section class="hero"><div class="hero-cover" id="heroCover"></div><div class="container hero-content"><h1>بوظة</h1><p>بوظة بنكهات مختارة وتقديم مميز من داما روز.</p></div></section>
<main class="section"><div class="container"><div class="section-head"><div><h2>منتجات بوظة</h2><div class="muted">اختر المنتج لعرض التفاصيل والأحجام والأسعار</div></div></div><div class="products" id="grid"></div></div></main>
<footer>© Dama Rose — جميع الحقوق محفوظة</footer>
<script>
const CATEGORY="بوظة";
const COVER_KEY="category_image_icecream";
const money=n=>Number(n||0).toFixed(3)+' ر.ع';
function minPrice(p){const xs=(p.variants||[]).map(v=>Number(v.price));return xs.length?Math.min(...xs):0}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(p){const img=p.image?' style="background-image:url(&quot;'+String(p.image).replace(/"/g,'&quot;')+'&quot;)"':'';return '<article class="card"><div class="ph"'+img+'></div><div class="card-body"><div class="name">'+esc(p.ar)+'</div><div class="price">ابتداءً من '+money(minPrice(p))+'</div><a class="add" href="product.html?id='+encodeURIComponent(p.id)+'">عرض المنتج</a></div></article>'}
function cachedProducts(){try{const x=JSON.parse(localStorage.getItem('damaRoseProducts')||'[]');return Array.isArray(x)?x:[]}catch{return []}}
function render(items){const xs=items.filter(p=>p.category===CATEGORY);grid.innerHTML=xs.length?xs.map(card).join(''):'<div class="empty">لا توجد منتجات في هذا القسم حاليًا.</div>'}
async function load(){const cached=cachedProducts();if(cached.length)render(cached);try{const pr=await fetch('/api/snapshot',{cache:'no-store'});if(pr.ok){const snap=await pr.json();const products=Array.isArray(snap.products)?snap.products:[];const s=snap.settings||{};if(products.length){localStorage.setItem('damaRoseProducts',JSON.stringify(products));render(products)}localStorage.setItem('damaRoseSettings',JSON.stringify(s));if(s[COVER_KEY])heroCover.style.backgroundImage='url("'+String(s[COVER_KEY]).replace(/"/g,'%22')+'")'}}catch(e){if(!cached.length)grid.innerHTML='<div class="empty">تعذر تحميل المنتجات.</div>'}}
const instant=cachedProducts();if(instant.length)render(instant);try{const ss=JSON.parse(localStorage.getItem('damaRoseSettings')||'{}');if(ss[COVER_KEY])heroCover.style.backgroundImage='url("'+String(ss[COVER_KEY]).replace(/"/g,'%22')+'")'}catch{}load();
</script>
</body></html>
